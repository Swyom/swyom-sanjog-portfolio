<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="hbNzgmDhHQP_3P1Lf2sJqDmTkvBZDDg-e8L6Z10iqQA" />
    <title>Swyom Sanjog</title>
    <meta name="description" content="Portfolio of P. Swyom Sanjog, a passionate Software Developer & BTech student specializing in React Native, FastAPI, PostgreSQL, and building real-world applications." />
    <link rel="icon" type="image/png" href="./assets/logo.png" />
    <link rel="apple-touch-icon" href="./assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#08080c] text-[#e2e8f0] antialiased selection:bg-[#ff5e18] selection:text-white">
    <div id="root">
      <style>
        .initial-loader {
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          background-color: #08080c;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 99999;
        }
        .loader-orb {
          width: 90px;
          height: 90px;
          background-color: #ff5e18;
          border-radius: 50%;
          box-shadow: -15px -15px 15px #ff6600, 15px -15px 15px #ff9100, 15px 15px 15px #ff5500, -15px 15px 15px #ffa600, -15px 0 15px #ff6600, 15px 0 15px #ffcc00;
          animation: orb-rotate 1.2s infinite ease-in-out;
          transform: rotate(0) scale(0.85);
        }
        @keyframes orb-rotate {
          0% { transform: rotate(360deg) scale(0.85); }
          50% { transform: rotate(0) scale(1.15); }
          100% { transform: rotate(360deg) scale(0.85); }
        }
      </style>
      <div class="initial-loader">
        <div class="loader-orb"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
